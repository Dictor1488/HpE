name: Vendor AS3 compile libraries

on:
  push:
    paths:
      - '.github/workflows/vendor-as3-libs.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  vendor-libs:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout HpE
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Copy known-good WoT AS3 libraries
        shell: bash
        run: |
          set -euo pipefail

          SRC_COMMIT="c303ae169905c7cd9ed8435c563e664b4dddf134"
          SRC_BASE="https://raw.githubusercontent.com/Dictor1488/MARKS/${SRC_COMMIT}/as3/libs"
          mkdir -p as3/libs

          download_and_check() {
            local name="$1"
            local expected_size="$2"
            echo "Downloading ${name}"
            curl --fail --location --retry 3 --silent --show-error \
              "${SRC_BASE}/${name}" \
              --output "as3/libs/${name}"

            local actual_size
            actual_size="$(stat -c%s "as3/libs/${name}")"
            if [ "${actual_size}" != "${expected_size}" ]; then
              echo "Size mismatch for ${name}: expected ${expected_size}, got ${actual_size}" >&2
              exit 1
            fi
          }

          download_and_check "base_app-1.0-SNAPSHOT.swc" 100211
          download_and_check "battle.swc" 10421
          download_and_check "common-1.0-SNAPSHOT.swc" 375072
          download_and_check "common_i18n_library-1.0-SNAPSHOT.swc" 1483873
          download_and_check "gui_base-1.0-SNAPSHOT.swc" 862361
          download_and_check "gui_battle-1.0-SNAPSHOT.swc" 983821
          download_and_check "gui_lobby-1.0-SNAPSHOT.swc" 3022321
          download_and_check "lobby.swc" 29432
          download_and_check "playerglobal.swc" 388809

      - name: Commit libraries to HpE
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add as3/libs

          if git diff --cached --quiet; then
            echo "Libraries are already up to date."
            exit 0
          fi

          git commit -m "Vendor WoT AS3 compile libraries"
          git push
