name: Build and Release HpE

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Mod version'
        required: true
        default: '0.1.4'
      build_swf:
        description: 'Build SWF files'
        required: true
        type: boolean
        default: true

permissions:
  contents: write

env:
  FLEX_VERSION: '4.16.1'
  FLASH_PLAYER_VERSION: '32.0'
  SWF_VERSION: '39'
  MOD_ID: 'me.inq.hpe'
  MOD_NAME: 'HpE'

jobs:
  build-and-release:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python 3
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Python 2.7
        shell: pwsh
        run: |
          choco install python2 -y --no-progress
          Import-Module "$env:ChocolateyInstall\helpers\chocolateyProfile.psm1"
          refreshenv
          $candidates = @(
            'C:\Python27\python.exe',
            'C:\tools\python2\python.exe',
            'C:\ProgramData\chocolatey\bin\python2.exe'
          )
          $python2 = $candidates | Where-Object { Test-Path -LiteralPath $_ } | Select-Object -First 1
          if (-not $python2) {
            $cmd = Get-Command python2.exe -ErrorAction SilentlyContinue
            if ($cmd) { $python2 = $cmd.Source }
          }
          if (-not $python2) { throw 'Python 2.7 executable was not found' }
          $python2 = (Resolve-Path -LiteralPath $python2).Path
          "PYTHON2_EXE=$python2" >> $env:GITHUB_ENV
          & $python2 --version

      - name: Set up Java
        if: inputs.build_swf == true || github.event_name == 'push'
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '11'

      - name: Cache Flex SDK
        if: inputs.build_swf == true || github.event_name == 'push'
        id: cache-flex
        uses: actions/cache@v4
        with:
          path: C:\flex-sdk
          key: flex-sdk-${{ env.FLEX_VERSION }}-hpe-v2

      - name: Download Apache Flex SDK
        if: (inputs.build_swf == true || github.event_name == 'push') && steps.cache-flex.outputs.cache-hit != 'true'
        shell: pwsh
        run: |
          $url = 'https://archive.apache.org/dist/flex/${{ env.FLEX_VERSION }}/binaries/apache-flex-sdk-${{ env.FLEX_VERSION }}-bin.zip'
          Invoke-WebRequest -Uri $url -OutFile flex.zip -UseBasicParsing -TimeoutSec 300
          Remove-Item C:\flex-sdk -Recurse -Force -ErrorAction SilentlyContinue
          Remove-Item C:\flex-temp -Recurse -Force -ErrorAction SilentlyContinue
          New-Item -ItemType Directory -Force -Path C:\flex-sdk | Out-Null
          Expand-Archive flex.zip -DestinationPath C:\flex-temp -Force
          $items = @(Get-ChildItem C:\flex-temp)
          if ($items.Count -eq 1 -and $items[0].PSIsContainer) {
            Get-ChildItem $items[0].FullName | Move-Item -Destination C:\flex-sdk -Force
          } else {
            Get-ChildItem C:\flex-temp | Move-Item -Destination C:\flex-sdk -Force
          }
          Remove-Item flex.zip -Force
          Remove-Item C:\flex-temp -Recurse -Force
          if (-not (Test-Path 'C:\flex-sdk\bin\mxmlc.bat')) { throw 'mxmlc.bat is missing' }

      - name: Configure playerglobal
        if: inputs.build_swf == true || github.event_name == 'push'
        shell: pwsh
        run: |
          $source = 'as3\libs\playerglobal.swc'
          if (-not (Test-Path $source)) { throw 'as3/libs/playerglobal.swc is missing' }
          $dest = 'C:\flex-sdk\frameworks\libs\player\32.0'
          New-Item -ItemType Directory -Force -Path $dest | Out-Null
          Copy-Item $source "$dest\playerglobal.swc" -Force
          Copy-Item $source 'C:\flex-sdk\frameworks\libs\player\playerglobal.swc' -Force
          $config = 'C:\flex-sdk\frameworks\flex-config.xml'
          if (Test-Path $config) {
            $text = Get-Content $config -Raw
            $text = $text -replace '\{playerglobalHome\}', 'C:/flex-sdk/frameworks/libs/player'
            $text | Set-Content $config -Encoding UTF8
          }

      - name: Compile HpE SWF
        if: inputs.build_swf == true || github.event_name == 'push'
        shell: pwsh
        run: |
          $mxmlc = 'C:\flex-sdk\bin\mxmlc.bat'
          if (-not (Test-Path $mxmlc)) { throw 'mxmlc.bat was not found' }
          New-Item -ItemType Directory -Force -Path as3\bin | Out-Null

          $mxmlcArgs = @(
            '-source-path+=as3/src_flash/src',
            '-output=as3/bin/hpePlayerPanel.swf',
            '-target-player=${{ env.FLASH_PLAYER_VERSION }}',
            '-swf-version=${{ env.SWF_VERSION }}',
            '-strict=true',
            '-optimize=true',
            '-warnings=true'
          )

          Get-ChildItem as3\libs -Filter *.swc | ForEach-Object {
            if ($_.Name -eq 'playerglobal.swc') {
              $mxmlcArgs += "-library-path+=$($_.FullName)"
            } else {
              $mxmlcArgs += "-external-library-path+=$($_.FullName)"
            }
          }
          $mxmlcArgs += '--'
          $mxmlcArgs += (Resolve-Path 'as3/src_flash/src/HpEPanel.as').Path

          & $mxmlc @mxmlcArgs
          if ($LASTEXITCODE -ne 0) { throw "AS3 compilation failed: $LASTEXITCODE" }
          if (-not (Test-Path 'as3/bin/hpePlayerPanel.swf')) { throw 'SWF output was not created' }

      - name: Prepare build metadata
        shell: pwsh
        run: |
          if ("${{ github.event_name }}" -eq 'workflow_dispatch') {
            $version = "${{ inputs.version }}"
          } else {
            $version = "${{ github.ref_name }}".TrimStart('v')
          }
          $jsonContent = @{
            python2 = ''
            info = @{
              id = '${{ env.MOD_ID }}'
              version = $version
              name = '${{ env.MOD_NAME }}'
              description = 'Reference-style mirrored HP display with configurable HP bars and class icon colors'
            }
          } | ConvertTo-Json -Depth 4
          $jsonContent | Out-File -FilePath build.json -Encoding UTF8
          "PROJECT_VERSION=$version" >> $env:GITHUB_ENV
          Get-Content build.json

      - name: Build .wotmod
        shell: pwsh
        run: python build.py

      - name: Upload to Release
        uses: ncipollo/release-action@v1.14.0
        with:
          tag: v${{ env.PROJECT_VERSION }}
          commit: ${{ github.sha }}
          artifacts: 'build/*.wotmod'
          allowUpdates: true
          removeArtifacts: true
          makeLatest: true
          token: ${{ secrets.GITHUB_TOKEN }}
